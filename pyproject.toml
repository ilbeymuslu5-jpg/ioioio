[project]
name = "trendyol-agent"
version = "0.1.0"
description = "Trendyol satici paneli icin dogal dil komutlariyla calisan asistan"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "click>=8.1",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "rich>=13.7",
]

[project.scripts]
trendyol-agent = "trendyol_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trendyol_agent*"]
